data:
  root: "/home/student/chipk/Radar"
  image_size: 80
  max_rainfall: 260.0
  input_frames: 6
  output_frames: 6

model:
  input_shape: [6, 80, 80, 1]
  target_shape: [6, 80, 80, 1]

  # Thesis: projector 1 -> 256
  base_units: 256

  # Với downsample=2 và 2 level:
  # 256 -> 1024
  scale_alpha: 2.0

  num_heads: 4

  # Giữ depth hiện tại trước:
  # 4 attention block ở level 80x80,
  # 4 ở level 40x40 mỗi nhánh.
  depth: [4, 4]

  self_pattern: "axial"

  downsample: 2
  downsample_type: "patch_merge"

  upsample_type: "upsample"
  upsample_kernel_size: 3

  attn_drop: 0.1
  proj_drop: 0.1
  ffn_drop: 0.1

  ffn_activation: "gelu"
  gated_ffn: false

  norm_layer: "layer_norm"
  padding_type: "zeros"
  pos_embed_type: "t+h+w"

  checkpoint_level: 2
  use_relative_pos: true
  self_attn_use_final_proj: true

  num_global_vectors: 0
  use_global_vector_ffn: false
  use_global_self_attn: true
  separate_global_qkv: true
  global_dim_ratio: 1

  time_embed_channels_mult: 4
  time_embed_use_scale_shift_norm: false
  time_embed_dropout: 0.0

  unet_res_connect: true

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"
  cosine_s: 0.008

  parameterization: "x0"

  learn_logvar: true
  logvar_init: 0.0

loss:
  type: "mse"

training:
  device: "cuda:2"

  batch_size: 1
  num_workers: 2

  lr: 0.0003
  weight_decay: 0.00001

  gradient_clip: 1.0
  accumulation_steps: 6
  ema_decay: 0.9999

  # checkpoint latent cũ không load được nữa
  resume: null

  epochs: 70

  max_train_batches: 5
  max_val_batches: 2

  use_ema: false

output:
  dir: "checkpoints/image_diffusion_mse"