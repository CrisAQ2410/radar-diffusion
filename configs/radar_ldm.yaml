data:
  root: "/home/student/chipk/Radar"
  image_size: 256
  max_rainfall: 260.0
  input_frames: 6
  output_frames: 6
  val_ratio: 0.1
  test_year: 2023

vae:
  config: "configs/radar_vae.yaml"
  checkpoint: "checkpoints/vae_kl/vae.pt"

model:
  input_shape: [6, 32, 32, 64]
  target_shape: [6, 32, 32, 64]

  base_units: 128
  scale_alpha: 1.0
  num_heads: 4

  depth: [4, 4]
  self_pattern: "axial"

  downsample: 2
  downsample_type: "patch_merge"

  upsample_type: "upsample"
  upsample_kernel_size: 3

  attn_drop: 0.1
  proj_drop: 0.1
  ffn_drop: 0.1

  ffn_activation: "gelu"
  gated_ffn: false

  norm_layer: "layer_norm"
  padding_type: "zeros"
  pos_embed_type: "t+h+w"

  checkpoint_level: 0
  use_relative_pos: true
  self_attn_use_final_proj: true

  num_global_vectors: 0
  use_global_vector_ffn: false
  use_global_self_attn: true
  separate_global_qkv: true
  global_dim_ratio: 1

  time_embed_channels_mult: 4
  time_embed_use_scale_shift_norm: false
  time_embed_dropout: 0.0

  unet_res_connect: true

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"
  cosine_s: 0.008

  parameterization: "x0"

  learn_logvar: true
  logvar_init: 0.0

training:
  device: "cuda:2"

  batch_size: 1
  num_workers: 2

  lr: 0.0003
  weight_decay: 0.00001

  gradient_clip: 1.0
  accumulation_steps: 6
  ema_decay: 0.9999

  resume: "checkpoints/ldm_mode/best.pt"

  epochs: 70

  max_train_batches: null
  max_val_batches: null

output:
  dir: "checkpoints/ldm_mode"