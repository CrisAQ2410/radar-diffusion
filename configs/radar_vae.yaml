data:
  root: "/home/student/chipk/Radar"
  image_size: 256
  max_rainfall: 260.0
  train_ratio: 0.8
  test_year: 2023

model:
  in_channels: 1
  out_channels: 1

  down_block_types:
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"

  up_block_types:
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"

  block_out_channels:
    - 128
    - 256
    - 512
    - 512

  layers_per_block: 2
  latent_channels: 64
  norm_num_groups: 32

training:
  batch_size: 2
  num_workers: 2
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001

  kl_weight: 0.000001

  device: "cuda:2"
  use_amp: false

output:
  dir: "checkpoints/vae_kl"